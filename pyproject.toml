[project]
name = "custos"
version = "0.1.0"
description = "A batch-loading ETL pipeline with automatic quarantine process for malformed data"
authors = [
    {name = "Jennifer L. Benedict",email = "jlbenedicta@gmail.com"}
]
license = "MIT"
requires-python = ">=3.12, <3.14"
dependencies = [
    "psycopg[binary] (>=3.3.5,<4.0.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "uuid6 (>=2025.0.1,<2026.0.0)",
    "cryptography (>=50.0.0,<51.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "holidays (>=0.103,<0.104)",
    "pytest-env (>=1.7.0,<2.0.0)",
    "python-magic (>=0.4.27,<0.5.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pydantic[email] (>=2.13.5,<3.0.0)",
    "testcontainers[postgres] (>=4.15.0,<5.0.0)",
    "vulture (>=2.16,<3.0)",
    "ruff (>=0.16.6,<0.17.0)",
    "faker (>=40.38.0,<41.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
env = [
    "CUSTOS_ENCRYPTION_KEY=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
]
[dependency-groups]
dev = [
    "vulture (>=2.16,<3.0)"
]
